name: Publish v4.0.1 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v4.0.1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'Yamoon-jjang/Ultra-Qwen-Image-Edit-Prompt-Selector'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Package standalone app, manuals and screenshots
        run: |
          python3 - <<'PY'
          import pathlib
          import zipfile
          root = pathlib.Path('.')
          name = 'Ultra-Qwen-Image-Edit-Prompt-Selector_v4.0.1.zip'
          paths = [
              'README.md',
              'LICENSE',
              'Ultra_qwen_prompt_selecter_v4.html',
              'Ultra_qwen_prompt_selecter_v4_Manual_EN.txt',
              'Ultra_qwen_prompt_selecter_v4_메뉴얼.txt',
          ]
          paths += sorted(str(p) for p in root.glob('assets/*.png'))
          with zipfile.ZipFile(name, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for path in paths:
                  if not (root / path).is_file():
                      raise RuntimeError('Missing release file: ' + path)
                  z.write(path, path)
          print(f'Created {name}: {len(paths)} files')
          PY

      - name: Publish or refresh GitHub Release v4.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v4.0.1 >/dev/null 2>&1; then
            # Same version, refreshed build: move the tag to this commit and replace the ZIP.
            git tag -f v4.0.1 "$GITHUB_SHA"
            git push -f origin refs/tags/v4.0.1
            gh release upload v4.0.1 Ultra-Qwen-Image-Edit-Prompt-Selector_v4.0.1.zip --clobber
            gh release edit v4.0.1 \
              --title 'Ultra Qwen Image Edit Prompt Selector v4.0.1' \
              --notes-file RELEASE_NOTES_v4.0.1.md \
              --latest
          else
            gh release create v4.0.1 \
              Ultra-Qwen-Image-Edit-Prompt-Selector_v4.0.1.zip \
              --title 'Ultra Qwen Image Edit Prompt Selector v4.0.1' \
              --notes-file RELEASE_NOTES_v4.0.1.md \
              --target "$GITHUB_SHA" \
              --latest
          fi
